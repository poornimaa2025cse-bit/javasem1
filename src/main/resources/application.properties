# ---------------------------------------------------
# Server
# ---------------------------------------------------
server.port=8080

# ---------------------------------------------------
# MySQL (primary datasource - so tables are visible in MySQL Workbench for your report)
#
# BEFORE running the app for the first time, open MySQL Workbench (or the
# mysql CLI) and run:   CREATE DATABASE smartlightingdb;
# (createDatabaseIfNotExist=true below will also try to do this for you,
#  but creating it manually first is the more reliable option for a viva demo.)
#
# Change the username/password below to match your own local MySQL install.
# ---------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smartlightingdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ---------------------------------------------------
# To switch to H2 (zero setup, no MySQL install needed) instead,
# comment out the 4 MySQL lines above and uncomment these 6 instead:
# ---------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:smartlightingdb;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ---------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------
# Jackson - keep enum names as-is, don't fail on empty beans
# ---------------------------------------------------
spring.jackson.default-property-inclusion=non_null
